<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — Compass</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e14" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0a0e14;
        --muted: #6b7280;
        --accent: #0a0e14;
        --border: rgba(10, 14, 20, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0e14;
          --fg: #f4f4f5;
          --muted: #9ca3af;
          --accent: #f4f4f5;
          --border: rgba(244, 244, 245, 0.16);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        max-width: 32rem;
        width: 100%;
        text-align: center;
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        color: var(--accent);
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      p {
        color: var(--muted);
        margin: 0 0 12px;
        line-height: 1.5;
      }
      .footnote {
        font-size: 0.85rem;
        margin-top: 24px;
      }
      button {
        margin-top: 20px;
        font: inherit;
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <svg
          class="icon"
          viewBox="0 0 32 32"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="16" cy="16" r="13" />
          <path d="M16 5 L19.2 16 L16 27 L12.8 16 Z" fill="currentColor" />
        </svg>
        <h1>You're offline.</h1>
        <p>
          No connection right now. Captures you make are queued locally and will sync
          automatically when you're back online.
        </p>
        <p class="footnote">
          Already typed something? It's safe — nothing is lost.
        </p>
        <button type="button" onclick="window.location.reload()">Try again</button>
      </div>
    </main>
    <script>
      window.addEventListener('online', () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
