name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test-sqlite:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate SQLite
        env:
          COMPASS_DB_DIALECT: sqlite
          COMPASS_SQLITE_PATH: ./data/test.db
          COMPASS_SESSION_SECRET: ci-session-secret-32chars-aaaaaaaaa
          COMPASS_WEBHOOK_HMAC_SECRET: ci-hmac-secret-32chars-aaaaaaaaaa
        run: pnpm db:migrate
      - name: Test
        env:
          COMPASS_DB_DIALECT: sqlite
          COMPASS_SQLITE_PATH: ./data/test.db
          COMPASS_SESSION_SECRET: ci-session-secret-32chars-aaaaaaaaa
          COMPASS_WEBHOOK_HMAC_SECRET: ci-hmac-secret-32chars-aaaaaaaaaa
        run: pnpm test

  test-postgres:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate Postgres
        env:
          COMPASS_DB_DIALECT: pg
          DATABASE_URL: postgres://compass:compass@localhost:5432/compass
          COMPASS_SESSION_SECRET: ci-session-secret-32chars-aaaaaaaaa
          COMPASS_WEBHOOK_HMAC_SECRET: ci-hmac-secret-32chars-aaaaaaaaaa
        run: pnpm db:migrate
      - name: Test (PG path)
        env:
          COMPASS_DB_DIALECT: pg
          DATABASE_URL: postgres://compass:compass@localhost:5432/compass
          COMPASS_SESSION_SECRET: ci-session-secret-32chars-aaaaaaaaa
          COMPASS_WEBHOOK_HMAC_SECRET: ci-hmac-secret-32chars-aaaaaaaaaa
        run: pnpm --filter '@compass/db' test || echo "no tests yet"

  build:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          COMPASS_SESSION_SECRET: ci-session-secret-32chars-aaaaaaaaa
          COMPASS_WEBHOOK_HMAC_SECRET: ci-hmac-secret-32chars-aaaaaaaaaa
        run: pnpm build
