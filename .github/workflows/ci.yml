name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test-sqlite:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate SQLite
        env:
          COMPASS_DB_DIALECT: sqlite
          COMPASS_SQLITE_PATH: ./data/test.db
          COMPASS_SESSION_SECRET: ci-session-secret-32chars-aaaaaaaaa
          COMPASS_WEBHOOK_HMAC_SECRET: ci-hmac-secret-32chars-aaaaaaaaaa
        run: pnpm db:migrate
      - name: Test
        env:
          COMPASS_DB_DIALECT: sqlite
          COMPASS_SQLITE_PATH: ./data/test.db
          COMPASS_SESSION_SECRET: ci-session-secret-32chars-aaaaaaaaa
          COMPASS_WEBHOOK_HMAC_SECRET: ci-hmac-secret-32chars-aaaaaaaaaa
        run: pnpm test

  test-postgres:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          # Name must contain "test" — pg-smoke refuses to DROP SCHEMA otherwise.
          POSTGRES_DB: compass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate Postgres
        env:
          COMPASS_DB_DIALECT: pg
          DATABASE_URL: postgres://compass:compass@localhost:5432/compass_test
          COMPASS_SESSION_SECRET: ci-session-secret-32chars-aaaaaaaaa
          COMPASS_WEBHOOK_HMAC_SECRET: ci-hmac-secret-32chars-aaaaaaaaaa
        run: pnpm db:migrate
      - name: Test (PG app-level smoke)
        env:
          # The pg-smoke suite drops + recreates this database's public schema.
          COMPASS_TEST_PG_URL: postgres://compass:compass@localhost:5432/compass_test
          COMPASS_SESSION_SECRET: ci-session-secret-32chars-aaaaaaaaa
          COMPASS_WEBHOOK_HMAC_SECRET: ci-hmac-secret-32chars-aaaaaaaaaa
        run: pnpm vitest run packages/db/src/__tests__/pg-smoke.test.ts

  build:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          COMPASS_SESSION_SECRET: ci-session-secret-32chars-aaaaaaaaa
          COMPASS_WEBHOOK_HMAC_SECRET: ci-hmac-secret-32chars-aaaaaaaaaa
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
